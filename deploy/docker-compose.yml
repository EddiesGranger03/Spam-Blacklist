services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vsf
      POSTGRES_PASSWORD: vsf
      POSTGRES_DB: vsf
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsf -d vsf"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://vsf:vsf@postgres:5432/vsf?sslmode=disable
      DATA_KEY: ${DATA_KEY:-}
      DATA_PEPPER: ${DATA_PEPPER:-}
      REDIS_ADDR: redis:6379
      SESSION_SECRET: dev-secret-not-for-production-0123456789
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe-12345
    ports:
      - "8090:8080"

volumes:
  pgdata:
