# Postgres + Redis riêng cho test quy mô (internal/scaletest, build tag `scale`). Tách khỏi compose dev/test:
# cổng 5545 và 6391 chỉ mở trên 127.0.0.1. KHÔNG có tmpfs: bảng 10M dòng (~3 GB gồm index) nằm trong volume
# `vsfscale_pgdata` nên sống sót qua `down` (seed 10M dòng mất ~4 phút, không muốn seed lại mỗi lần).
# Xóa hẳn dữ liệu: `docker compose -f deploy/docker-compose.scale.yml down -v`.
#
# Chạy: scripts/scale-test.sh   (xem docs/SCALE_TEST.md)
name: vsfscale

services:
  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: vsf
      POSTGRES_PASSWORD: vsf
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5545:5432"
    shm_size: 256mb
    mem_limit: 3g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsf"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6391:6379"
    mem_limit: 256m

volumes:
  pgdata:
