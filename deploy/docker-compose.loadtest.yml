# Loadtest có giới hạn tài nguyên, để xem CPU và RAM từng thành phần khi chịu tải.
# Chạy (project riêng "vsfload", không đụng compose dev; chỉ mở cổng app 8190):
#   docker compose -f deploy/docker-compose.loadtest.yml up -d --build
#   docker stats                      # xem CPU và RAM từng container (CPU% tính trên 1 nhân: 200% = 2 nhân)
#   go run ./cmd/bench -url http://127.0.0.1:8190 -key <API key> -file data.csv -c 64 -d 30s
#   docker compose -f deploy/docker-compose.loadtest.yml down -v
# Đăng nhập admin: admin@attack.test / ChangeMe-12345 (chỉ dùng cho loadtest cục bộ).
name: vsfload

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vsf
      POSTGRES_PASSWORD: vsf
      POSTGRES_DB: vsf
    cpus: 4
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsf -d vsf"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "vsf-load-redis"]
    cpus: 1
    mem_limit: 256m

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: vsf-app:load
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://vsf:vsf@postgres:5432/vsf?sslmode=disable
      DATA_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DATA_PEPPER: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: vsf-load-redis
      SESSION_SECRET: dev-secret-not-for-production-0123456789
      BOOTSTRAP_ADMIN_EMAIL: admin@attack.test
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe-12345
      PG_MAX_CONNS: "32"
    cpus: 2
    mem_limit: 1g
    ports:
      - "127.0.0.1:8190:8080"
